<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikmin Tracker</title>
<style>
  :root{
    --bg:#f6f7f2; --card:#ffffff; --ink:#1f2a1f; --muted:#6b776b; --line:#e2e6dc; --accent:#3f8f4f; --accent-ink:#fff; --danger:#c2413b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a14; --card:#1d261d; --ink:#e8efe6; --muted:#97a597; --line:#2c382c; --accent:#5bb06c; --accent-ink:#0d150d; --danger:#e06a63; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
  h1{font-size:20px;margin:6px 0 14px}
  h2{font-size:14px;margin:14px 0 8px;color:var(--muted);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--muted);font-size:12px}
  .colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:8px}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:14px}
  .chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
  .chip.on{outline:2px solid var(--accent)}
  .chip.sm{padding:6px 9px;font-size:13px;justify-content:space-between}
  .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
  .chip small{color:var(--muted);display:block;font-size:11px}
  .chip b{font-size:16px}
  .chip.sm b{font-size:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input,select,button{font:inherit;color:var(--ink)}
  input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
  input[type=checkbox]{padding:0}
  button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.danger{color:var(--danger)}
  .pickrow{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pickrow .lbl{min-width:44px}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick button{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px}
  .pick button.on{outline:2px solid var(--accent);background:var(--bg);font-weight:600}
  .p .pick button{padding:4px 10px;font-size:13px}
  .pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
  .pager:empty{display:none}
  button:disabled{opacity:.4;cursor:default}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));align-items:start}
  .list .empty{grid-column:1/-1}
  .p button{padding:4px 9px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
  .p.rel{opacity:.85}
  .p .top{display:flex;gap:8px;align-items:center}
  .p .name{flex:1;font-weight:600;border-color:transparent;background:transparent}
  .p .name:focus{border-color:var(--line);background:var(--bg)}
  .p .meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button{padding:3px 9px}
  .stepper span{min-width:28px;text-align:center;font-weight:600}
  .stepper .fruitin{width:64px;text-align:center;font-weight:600;padding:5px 4px;-moz-appearance:textfield;appearance:textfield}
  .stepper .fruitin::-webkit-outer-spin-button,.stepper .fruitin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper .hearts{min-width:0;white-space:nowrap;font-weight:400}
  .stepper .hearts .h{min-width:0;font-size:18px;letter-spacing:1px}
  .stepper .hearts .tag{min-width:0}
  .lbl{color:var(--muted);font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:28px 0}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  .tag{font-size:11px;color:var(--muted)}
  .badge{font-size:11px;background:#f5b50a;color:#3b2a00;border-radius:999px;padding:2px 8px;font-weight:600}
  .chk{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
  .mrow{padding:4px 0;border-top:1px solid var(--line)}
  .mrow input[type=text],.mrow input:not([type]){flex:1;min-width:110px}
  @media(max-width:520px){ input.decor{width:100%} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌱 Pikmin Tracker</h1>

  <div class="stats" id="stats"></div>
  <div class="colors" id="colors"></div>
  <h2>Decor categories</h2>
  <div class="cats" id="cats"></div>

  <div class="panel">
    <div class="row">
      <div class="pickrow"><span class="lbl">Color</span><div class="pick" id="colorPick" role="radiogroup" aria-label="Color"></div></div>
      <div class="pickrow"><span class="lbl">Decor</span><div class="pick" id="statusPick" role="radiogroup" aria-label="Decor status"></div></div>
      <input type="hidden" id="newColor" value="Red">
      <input type="hidden" id="newStatus" value="none">
      <input id="newName" placeholder="Name (optional)" style="flex:1;min-width:130px">
      <input id="newDecor" class="decor" list="decorlist" placeholder="Decor or category (type to search)" autocomplete="off" style="flex:1;min-width:150px">
      <span id="newExtras" class="row"></span>
      <button class="primary" id="addBtn">Add Pikmin</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="manageBtn">Manage decors / add new decor</button>
      <span class="tag" id="addMsg"></span>
    </div>
  </div>

  <div class="panel" id="manage" hidden></div>
  <datalist id="catlist"></datalist>
  <datalist id="decorlist"></datalist>

  <div class="tabs">
    <button id="tabActive" class="on">Active</button>
    <button id="tabReleased">Released</button>
  </div>

  <div class="panel row">
    <input id="q" placeholder="Search name, decor, place, letter" style="flex:1;min-width:140px">
    <select id="fDecor">
      <option value="all">Any decor</option>
      <option value="none">No decor yet</option>
      <option value="has">Has decor (not rare)</option>
      <option value="rare">Has rare decor</option>
    </select>
    <select id="sort">
      <option value="created">Newest first</option>
      <option value="name">Name</option>
      <option value="color">Color</option>
      <option value="affinity">Affinity ↓</option>
      <option value="fruits">Fruits ↓</option>
    </select>
    <button id="clearFilters">Clear filters</button>
  </div>

  <div class="pager" id="pagerTop"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pagerBot"></div>

  <div class="panel row" style="margin-top:14px">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <span class="tag" id="ioMsg"></span>
  </div>
  <div class="note" id="storeNote"></div>
</div>

<script>
const COLORS = [
  {k:'Red',h:'#e5484d'},{k:'Yellow',h:'#f5c518'},{k:'Blue',h:'#3b82f6'},{k:'Purple',h:'#8b5cf6'},
  {k:'White',h:'#f1f5f9'},{k:'Winged',h:'#f9a8d4'},{k:'Rock',h:'#78716c'},{k:'Ice',h:'#7dd3fc'}
];

/* [category, decor name, flags]  flags: r = has a rare version, p = needs a place, l = needs a letter */
const DEFAULT_CATALOG = [
  ['Restaurant','Chef hat','r'],
  ['Cafe','Coffee cup','r'],
  ['Dessert','Macaron'],['Dessert','Donut'],
  ['Movie theater','Popcorn'],
  ['Pharmacy','Toothbrush','r'],
  ['Zoo','Dandelion'],
  ['Forest','Stag beetle','r'],['Forest','Acorn','r'],
  ['Waterside','Fishing lure','r'],
  ['Post office','Stamps'],
  ['Art gallery','Picture frame'],
  ['Airport','Paper plane','p'],['Airport','Luggage tag','p'],
  ['Station','Paper train','p'],['Station','Ticket','p'],
  ['Beach','Shell'],
  ['Burger place','Burger'],
  ['Corner store','Bottle cap'],['Corner store','Snack'],
  ['Supermarket','Mushroom'],['Supermarket','Banana','r'],
  ['Bakery','Baguette','r'],['Bakery','Pastry'],
  ['Hair salon','Scissors','r'],
  ['Clothes store','Hair tie'],
  ['Park','3-leaf clover','r'],['Park','4-leaf clover','r'],
  ['Library and bookstore','Tiny book'],
  ['Roadside','Green sticker','l'],['Roadside','Blue sticker','l'],['Roadside','Yellow sticker','l'],['Roadside','Coin','r'],
  ['Sushi restaurant','Sushi'],
  ['Mountain','Mountain pin badge'],
  ['Stadium','Ball keychain','r'],
  ['Rainy day','Leaf hat'],
  ['Snowy day','Snow'],
  ['Theme park','Theme park ticket'],
  ['Bus stop','Paper bus'],
  ['Italian restaurant','Pizza'],['Italian restaurant','Pasta'],
  ['Ramen restaurant','Ramen keychain'],
  ['Bridge','Bridge pin'],
  ['Hotel','Hotel amenities'],
  ['Makeup store','Makeup'],
  ['Shrine and temple','Fortune'],
  ['Appliance store','Battery'],['Appliance store','Fairy light'],
  ['Curry restaurant','Curry'],
  ['DIY store','Tool'],
  ['University and college','School badge','p'],
  ['Mexican restaurant','Tacos'],
  ['Laundromat and dry cleaners','Laundry items'],
  ['Korean restaurant','Kimchi'],
  ['Stationery store','Stationery']
];
const mkDecor = ([category,name,f='']) => ({category,name,rare:f.includes('r'),place:f.includes('p'),letter:f.includes('l')});

let items = [];
let catalog = DEFAULT_CATALOG.map(mkDecor);
let tab = 'active';
let colorFilter = null;
let catFilter = null;
let page = 1, lastPage = 1, pageSize = 25;
try{ const ps=+localStorage.getItem('pikminTracker.pageSize'); if([25,50,100].includes(ps)) pageSize=ps; }catch(e){}
let manageOpen = false;
let delConfirm = -1;
let store = null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cHex = k => (COLORS.find(c=>c.k===k)||{}).h || '#999';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- catalog helpers ---------- */
const decorByName = n => catalog.find(d=>d.name===n);
const categories = () => [...new Set(catalog.map(d=>d.category))];
const catLabel = c => { const ds=catalog.filter(d=>d.category===c); return ds.length===1?ds[0].name:c; };
// a Pikmin can be in a decor category without having its decor yet (pendCat)
const PEND=' (no decor yet)';
const catOf = p => { if(p.decor){ const d=decorByName(p.decor); return d?d.category:'Custom'; } return p.pendCat||null; };
// decor status: 'none' (no decor yet) / 'has' / 'rare'. Older saved Pikmin without a status are derived once.
const statusOf = p => ['none','has','rare'].includes(p.status) ? p.status : (!p.decor ? 'none' : (p.rare ? 'rare' : 'has'));
const displayDecor = p => p.decor || (p.pendCat ? p.pendCat+PEND : '');

/* ---------- storage: db if available, localStorage fallback ---------- */
function makeLocalStore(){
  const KEY='pikminTracker.v1';
  let cb=null;
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } };
  let data=load();
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} if(cb) cb(data.slice()); };
  return {
    kind:'local',
    subscribe(f){ cb=f; f(data.slice()); },
    save(p){ const i=data.findIndex(x=>x.id===p.id); if(i>=0) data[i]=p; else data.push(p); persist(); },
    remove(id){ data=data.filter(x=>x.id!==id); persist(); }
  };
}
async function makeDbStore(){
  try{
    if(!window.claude || !window.claude.use) return null;
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    if(!db || !user) return null;
    const id = await user.id();
    const col = db.collection('data/users/'+id+'/pikmin');
    return {
      kind:'db',
      subscribe(f){
        col.onSnapshot(snap=>{
          let arr=[];
          const norm=d=> (d && typeof d.data==='function') ? Object.assign({id:d.id}, d.data()) : d;
          if(Array.isArray(snap)) arr=snap.map(norm);
          else if(snap && snap.docs) arr=snap.docs.map(norm);
          else if(snap && typeof snap.forEach==='function'){ snap.forEach(d=>arr.push(norm(d))); }
          f(arr.filter(Boolean));
        });
      },
      save(p){ return col.doc(p.id).set(p); },
      remove(id){ return col.doc(id).delete(); }
    };
  }catch(e){ return null; }
}

/* ---------- actions ---------- */
function upsert(p){
  const i=items.findIndex(x=>x.id===p.id);
  if(i>=0) items[i]=p; else items.push(p);
  store.save(p);
  render();
}
function patch(id, ch){
  const p=items.find(x=>x.id===id); if(!p) return;
  upsert(Object.assign({}, p, ch));
}
// the decor box (which decor/category) and the decor status (none / has / rare) are independent
function setStatus(id,st){ patch(id,{status:st}); }
function saveCatalog(){
  store.save({id:'__catalog',kind:'catalog',decors:catalog});
  refreshDecorUi();
  render();
}
function readExtras(root, d){
  const g=f=>root.querySelector('[data-f="'+f+'"]');
  return {
    place: d&&d.place&&g('place') ? g('place').value.trim() : '',
    letter: d&&d.letter&&g('letter') ? g('letter').value.trim().toUpperCase() : ''
  };
}
function addPikmin(){
  const color=$('newColor').value;
  const rd=resolveDecor($('newDecor').value);
  if(rd===null){ $('addMsg').textContent='Pick a decor from the list, or add it under Manage decors.'; return; }
  const status=$('newStatus').value;
  const decor=rd.decor, pendCat=rd.pendCat;
  const ex=readExtras($('newExtras'), decorByName(decor));
  $('addMsg').textContent='';
  const n=$('newName').value.trim();
  const same=items.filter(x=>x.color===color).length+1;
  upsert(Object.assign({id:uid(), name:n||(color+' '+same), color, decor, pendCat, status, affinity:0, fruits:0, released:false, releasedAt:null, createdAt:Date.now()}, ex));
  $('newName').value='';
  $('newDecor').value='';
  refreshNewExtras();
}
function removeForever(id){
  const p=items.find(x=>x.id===id); if(!p) return;
  if(!p._confirm){ patch(id,{_confirm:true}); setTimeout(()=>{ const q=items.find(x=>x.id===id); if(q&&q._confirm){ patch(id,{_confirm:false}); } },4000); return; }
  items=items.filter(x=>x.id!==id); store.remove(id); render();
}

/* ---------- add-form pickers (choose one) ---------- */
const STATUSES=[['none','No decor yet'],['has','Has decor'],['rare','★ Has rare decor']];
function renderPickers(){
  const col=$('newColor').value, st=$('newStatus').value;
  const btn=(attr,v,on,inner)=>`<button type="button" role="radio" aria-checked="${on}" class="${on?'on':''}" ${attr}="${esc(v)}">${inner}</button>`;
  $('colorPick').innerHTML=COLORS.map(c=>btn('data-pc',c.k,c.k===col,`<span class="dot" style="background:${c.h}"></span>${c.k}`)).join('');
  $('statusPick').innerHTML=STATUSES.map(([v,l])=>btn('data-ps',v,v===st,l)).join('');
}
$('colorPick').addEventListener('click',e=>{
  const b=e.target.closest('[data-pc]'); if(!b) return;
  $('newColor').value=b.dataset.pc; renderPickers();
});
$('statusPick').addEventListener('click',e=>{
  const b=e.target.closest('[data-ps]'); if(!b) return;
  $('newStatus').value=b.dataset.ps; renderPickers(); refreshNewExtras();
});

/* ---------- hearts ---------- */
// affinity level 0-8: 0-4 = red hearts filling up; 5-8 = red full, 1-4 yellow hearts (1 yellow = 4 red)
function hearts(level){
  const L=Math.max(0,Math.min(8,+level||0));
  const yellow=Math.max(0,L-4), red=Math.min(L,4);
  let out='';
  for(let i=0;i<4;i++){
    const col = L<=4 ? (i<red?'#e5484d':'#b8bfb4') : (i<yellow?'#f5b50a':'#e5484d');
    out+=`<span class="h" style="color:${col}">♥</span>`;
  }
  const label = L===0 ? 'no hearts' : L<=4 ? red+'/4 red' : yellow+'/4 yellow';
  return `${out}<span class="tag"> ${label}</span>`;
}

/* ---------- decor UI pieces ---------- */
// searchable decor input: typing filters the list (matches decor name or category)
function decorListHtml(){
  return catalog.map(d=>`<option value="${esc(d.name)}" label="${esc(d.category)}"></option>`).join('')
    + categories().map(c=>`<option value="${esc(c+PEND)}" label="Category only"></option>`).join('');
}
// -> {decor, pendCat}: empty = no decor; decor = matched catalog decor; pendCat = in that category, decor not obtained yet; null = not in the list
function resolveDecor(v){
  const k=(v||'').trim(); if(!k) return {decor:'',pendCat:''};
  const low=k.toLowerCase();
  const d=catalog.find(x=>x.name.toLowerCase()===low);
  if(d) return {decor:d.name,pendCat:''};
  const c=categories().find(x=>x.toLowerCase()===low || (x+PEND).toLowerCase()===low);
  if(c) return {decor:'',pendCat:c};
  return null;
}
function extrasHtml(d,p){
  if(!d) return '';
  let h='';
  if(d.place) h+=`<input data-f="place" value="${esc(p.place)}" placeholder="Place name" style="width:150px">`;
  if(d.letter) h+=`<input data-f="letter" value="${esc(p.letter)}" placeholder="Letter" maxlength="3" style="width:70px">`;
  return h;
}
function refreshNewExtras(){
  const r=resolveDecor($('newDecor').value);
  $('newExtras').innerHTML = r&&r.decor ? extrasHtml(decorByName(r.decor), {}) : '';
}
function refreshDecorUi(){
  $('decorlist').innerHTML=decorListHtml();
  refreshNewExtras();
  $('catlist').innerHTML=categories().map(c=>`<option value="${esc(c)}">`).join('');
  renderManage();
}

/* ---------- manage decors ---------- */
function renderManage(){
  const el=$('manage');
  el.hidden=!manageOpen;
  if(!manageOpen) return;
  const row=(d,i)=>`<div class="row mrow" data-ci="${i}" data-s="${esc((d.name+' '+d.category).toLowerCase())}">
      <input data-cf="name" value="${esc(d.name)}" placeholder="Decor name">
      <input data-cf="category" list="catlist" value="${esc(d.category)}" placeholder="Category">
      <label class="chk"><input type="checkbox" data-cf="place" ${d.place?'checked':''}> Place</label>
      <label class="chk"><input type="checkbox" data-cf="letter" ${d.letter?'checked':''}> Letter</label>
      <button class="danger" data-del="${i}">${delConfirm===i?'Tap again to delete':'Delete'}</button>
    </div>`;
  let h=`<div class="row"><b>Manage decors</b><button id="mClose" style="margin-left:auto">Close</button></div>
    <div class="note">“Place” and “Letter” add those fields to a Pikmin with that decor (airports, stations, schools, roadside stickers).</div>
    <h2>Add new decor (monthly themes, etc.)</h2>
    <div class="row">
      <input id="mName" placeholder="Decor name" style="flex:1;min-width:120px">
      <input id="mCat" list="catlist" placeholder="Category (existing or new)" style="flex:1;min-width:140px">
      <label class="chk"><input type="checkbox" id="mPlace"> Place</label>
      <label class="chk"><input type="checkbox" id="mLetter"> Letter</label>
      <button class="primary" id="mAdd">Add decor</button>
    </div>
    <div class="tag" id="mMsg"></div>
    <h2>All decors</h2>
    <input id="mSearch" placeholder="Search decors or categories" autocomplete="off" style="width:100%;margin-bottom:6px">`;
  h+=categories().map(c=>`<div class="mgroup"><div class="lbl" style="margin:10px 0 2px"><b>${esc(c)}</b></div>`+catalog.map((d,i)=>d.category===c?row(d,i):'').join('')+`</div>`).join('');
  el.innerHTML=h;
}
$('manage').addEventListener('input',e=>{
  if(e.target.id!=='mSearch') return;
  const q=e.target.value.trim().toLowerCase();
  $('manage').querySelectorAll('.mgroup').forEach(g=>{
    let any=false;
    g.querySelectorAll('.mrow').forEach(r=>{ const show=!q||r.dataset.s.includes(q); r.hidden=!show; any=any||show; });
    g.hidden=!any;
  });
});
function canonCat(c){
  const k=c.trim(); if(!k) return '';
  return categories().find(x=>x.toLowerCase()===k.toLowerCase()) || k;
}
$('manage').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='mClose'){ manageOpen=false; renderManage(); return; }
  if(b.id==='mAdd'){
    const name=$('mName').value.trim(), cat=canonCat($('mCat').value);
    if(!name||!cat){ $('mMsg').textContent='Enter a decor name and a category.'; return; }
    if(decorByName(name)){ $('mMsg').textContent='That decor already exists.'; return; }
    catalog=catalog.concat([{category:cat,name,rare:false,place:$('mPlace').checked,letter:$('mLetter').checked}]);
    saveCatalog();
    return;
  }
  if(b.dataset.del!==undefined){
    const i=+b.dataset.del;
    if(delConfirm!==i){ delConfirm=i; renderManage(); setTimeout(()=>{ if(delConfirm===i){ delConfirm=-1; renderManage(); } },4000); return; }
    delConfirm=-1;
    catalog=catalog.filter((_,j)=>j!==i);
    saveCatalog();
  }
});
$('manage').addEventListener('change',e=>{
  const t=e.target, row=t.closest('.mrow'); if(!row||!t.dataset.cf) return;
  const i=+row.dataset.ci, d=catalog[i], f=t.dataset.cf; if(!d) return;
  if(f==='name'){
    const nv=t.value.trim();
    if(!nv || (nv!==d.name && decorByName(nv))){ renderManage(); return; }
    const old=d.name;
    catalog=catalog.map((x,j)=>j===i?Object.assign({},x,{name:nv}):x);
    items.filter(p=>p.decor===old).forEach(p=>patch(p.id,{decor:nv}));
  } else if(f==='category'){
    const nv=canonCat(t.value);
    if(!nv){ renderManage(); return; }
    catalog=catalog.map((x,j)=>j===i?Object.assign({},x,{category:nv}):x);
  } else {
    catalog=catalog.map((x,j)=>j===i?Object.assign({},x,{[f]:t.checked}):x);
  }
  saveCatalog();
});
$('manageBtn').onclick=()=>{ manageOpen=!manageOpen; renderManage(); if(manageOpen) $('manage').scrollIntoView({block:'nearest'}); };

/* ---------- render ---------- */
function render(){
  const active=items.filter(p=>!p.released), rel=items.filter(p=>p.released);
  // status is independent of which decor/category is chosen: no decor yet / has decor / has rare decor
  const noneN=active.filter(p=>statusOf(p)==='none').length;
  const plainN=active.filter(p=>statusOf(p)==='has').length;
  const rareN=active.filter(p=>statusOf(p)==='rare').length;
  const sum=(a,k)=>a.reduce((s,p)=>s+(+p[k]||0),0);
  $('stats').innerHTML = [
    ['Active',active.length],['Released',rel.length],['No decor yet',noneN],
    ['Has decor',plainN],['Has rare decor',rareN],['Total fruits',sum(items,'fruits')]
  ].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');

  const pool = tab==='active'?active:rel;
  $('colors').innerHTML = COLORS.map(c=>{
    const a=pool.filter(p=>p.color===c.k);
    const d=a.filter(p=>statusOf(p)==='has').length;
    const rr=a.filter(p=>statusOf(p)==='rare').length;
    const ne=a.filter(p=>statusOf(p)==='none').length;
    return `<button class="chip ${colorFilter===c.k?'on':''}" data-c="${c.k}"><span class="dot" style="background:${c.h}"></span><span><b>${a.length}</b> ${c.k}<small>${ne} none · ${d} decor · ${rr} rare</small></span></button>`;
  }).join('');
  $('colors').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ colorFilter = colorFilter===b.dataset.c?null:b.dataset.c; page=1; render(); });

  // decor category tally (only categories that have Pikmin in this tab)
  const tally={};
  pool.forEach(p=>{ const k=catOf(p); if(!k) return; (tally[k]=tally[k]||{n:0,r:0,w:0}).n++; if(statusOf(p)==='rare') tally[k].r++; if(statusOf(p)==='none') tally[k].w++; });
  const order=categories().concat(Object.keys(tally).filter(k=>!categories().includes(k))).filter(k=>tally[k]);
  $('cats').innerHTML = order.length ? order.map(k=>{
    const t=tally[k];
    return `<button class="chip sm ${catFilter===k?'on':''}" data-k="${esc(k)}"><span>${esc(k==='Custom'?'Custom':catLabel(k))}</span><span><b>${t.n}</b>${t.r?` <small style="display:inline">(${t.r} rare)</small>`:''}${t.w?` <small style="display:inline">(${t.w} not yet)</small>`:''}</span></button>`;
  }).join('') : `<div class="tag">No decor Pikmin here yet.</div>`;
  $('cats').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ catFilter = catFilter===b.dataset.k?null:b.dataset.k; page=1; render(); });

  $('tabActive').className = tab==='active'?'on':'';
  $('tabReleased').className = tab==='released'?'on':'';
  $('tabActive').textContent='Active ('+active.length+')';
  $('tabReleased').textContent='Released ('+rel.length+')';

  const q=$('q').value.trim().toLowerCase(), fd=$('fDecor').value, so=$('sort').value;
  let list=pool.filter(p=>(!colorFilter||p.color===colorFilter)
    && (!catFilter||catOf(p)===catFilter)
    && (fd==='all'||statusOf(p)===fd)
    && (!q||[p.name,p.decor,p.pendCat,p.place,p.letter].some(s=>(s||'').toLowerCase().includes(q))));
  const ci=k=>COLORS.findIndex(c=>c.k===k);
  list.sort((a,b)=> so==='name'?(a.name||'').localeCompare(b.name||'')
    : so==='color'?ci(a.color)-ci(b.color)
    : so==='affinity'?(b.affinity||0)-(a.affinity||0)
    : so==='fruits'?(b.fruits||0)-(a.fruits||0)
    : (b.createdAt||0)-(a.createdAt||0));

  // pagination: only render one page of cards at a time
  const total=list.length, pages=Math.max(1,Math.ceil(total/pageSize));
  if(page>pages) page=pages;
  if(page<1) page=1;
  lastPage=pages;
  const start=(page-1)*pageSize;
  const shown=list.slice(start,start+pageSize);
  const sizeSel=`<select class="pgsize" aria-label="Per page">${[25,50,100].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n} per page</option>`).join('')}</select>`;
  const pager = total ? `<span class="tag">${start+1}–${start+shown.length} of ${total}</span>
    <span class="row"><button data-pg="first" ${page<=1?'disabled':''}>«</button><button data-pg="prev" ${page<=1?'disabled':''}>‹ Prev</button><span>Page ${page} / ${pages}</span><button data-pg="next" ${page>=pages?'disabled':''}>Next ›</button><button data-pg="last" ${page>=pages?'disabled':''}>»</button></span>${sizeSel}` : '';
  $('pagerTop').innerHTML=pager;
  $('pagerBot').innerHTML=pages>1?pager:'';

  if(!list.length){ $('list').innerHTML=`<div class="empty">${tab==='active'?'No Pikmin here yet.':'Nothing released.'}</div>`; }
  else $('list').innerHTML = shown.map(p=>{
    const colorOpts=COLORS.map(c=>`<option ${c.k===p.color?'selected':''}>${c.k}</option>`).join('');
    const relInfo=p.released?`<span class="tag">Released ${p.releasedAt?new Date(p.releasedAt).toLocaleDateString():''}</span>`:'';
    const d=decorByName(p.decor);
    const st=statusOf(p);
    const badge=st==='none'?`<span class="tag">⏳ no decor yet</span>`:(st==='rare'?`<span class="badge">★ Rare decor</span>`:`<span class="tag">✓ has decor</span>`);
    return `<div class="p ${p.released?'rel':''}" data-id="${p.id}">
      <div class="top">
        <span class="dot" style="background:${cHex(p.color)};width:20px;height:20px"></span>
        <input class="name" value="${esc(p.name)}" data-f="name" aria-label="Name">
        ${badge}${relInfo}
      </div>
      <div class="meta">
        <select data-f="color">${colorOpts}</select>
        <input class="decor" data-f="decor" list="decorlist" value="${esc(displayDecor(p))}" placeholder="Decor or category (type to search)" autocomplete="off" style="flex:1;min-width:150px">
        ${extrasHtml(d,p)}
      </div>
      <div class="meta">
        <span class="lbl">Decor status</span>
        <div class="pick">${STATUSES.map(([v,l])=>`<button type="button" data-cs="${v}" class="${v===st?'on':''}">${l}</button>`).join('')}</div>
      </div>
      <div class="meta">
        <span class="stepper"><span class="lbl">Affinity</span><button data-s="affinity" data-d="-1">−</button><span class="hearts">${hearts(p.affinity)}</span><button data-s="affinity" data-d="1">+</button></span>
        <span class="stepper"><span class="lbl">Fruits</span><button data-s="fruits" data-d="-1">−</button><input type="number" inputmode="numeric" min="0" step="1" class="fruitin" data-f="fruits" value="${p.fruits||0}" aria-label="Fruits"><button data-s="fruits" data-d="1">+</button></span>
      </div>
      <div class="row">
        ${p.released
          ? `<button data-a="restore">Restore to active</button>`
          : `<button data-a="release">Release</button>`}
        <button class="danger" data-a="delete">${p._confirm?'Tap again to delete forever':'Delete'}</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const card=b.closest('.p'); if(!card) return;
  const id=card.dataset.id, p=items.find(x=>x.id===id); if(!p) return;
  if(b.dataset.cs){ setStatus(id,b.dataset.cs); }
  else if(b.dataset.s){ const max=b.dataset.s==='affinity'?8:Infinity; patch(id,{[b.dataset.s]:Math.min(max,Math.max(0,(+p[b.dataset.s]||0)+(+b.dataset.d)))}); }
  else if(b.dataset.a==='release') patch(id,{released:true,releasedAt:Date.now()});
  else if(b.dataset.a==='restore') patch(id,{released:false,releasedAt:null});
  else if(b.dataset.a==='delete') removeForever(id);
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t.dataset||!t.dataset.f) return;
  const card=t.closest('.p'); if(!card) return;
  const id=card.dataset.id, f=t.dataset.f, cur=items.find(x=>x.id===id); if(!cur) return;
  if(f==='decor'){
    if(t.value.trim()===displayDecor(cur)) return;
    const r = resolveDecor(t.value);
    if(r===null){ render(); return; }
    const d=decorByName(r.decor);
    patch(id,{decor:r.decor, pendCat:r.pendCat, place:d&&d.place?(cur.place||''):'', letter:d&&d.letter?(cur.letter||''):''});
  }
  else if(f==='letter'){ patch(id,{letter:t.value.trim().toUpperCase()}); }
  else if(f==='fruits'){ patch(id,{fruits:Math.max(0,Math.floor(+t.value)||0)}); }
  else { patch(id,{[f]:t.value.trim()}); }
});
$('newStatus').addEventListener('change',refreshNewExtras);
$('newDecor').addEventListener('input',refreshNewExtras);
$('newDecor').addEventListener('change',refreshNewExtras);
$('addBtn').onclick=addPikmin;
$('newName').addEventListener('keydown',e=>{ if(e.key==='Enter') addPikmin(); });
$('tabActive').onclick=()=>{tab='active';page=1;render();};
$('tabReleased').onclick=()=>{tab='released';page=1;render();};
$('clearFilters').onclick=()=>{colorFilter=null;catFilter=null;$('q').value='';$('fDecor').value='all';page=1;render();};
['q','fDecor','sort'].forEach(i=>$(i).addEventListener('input',()=>{page=1;render();}));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pg]'); if(!b||b.disabled) return;
  const k=b.dataset.pg;
  page = k==='first'?1 : k==='prev'?page-1 : k==='next'?page+1 : lastPage;
  render();
  $('pagerTop').scrollIntoView({block:'start'});
});
document.addEventListener('change',e=>{
  if(!e.target.classList||!e.target.classList.contains('pgsize')) return;
  pageSize=+e.target.value||25; page=1;
  try{ localStorage.setItem('pikminTracker.pageSize',String(pageSize)); }catch(err){}
  render();
});

/* ---------- backup ---------- */
$('exportBtn').onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify({app:'pikmin-tracker',version:2,catalog,items:items.map(({_confirm,...p})=>p)},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='pikmin-tracker-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    $('ioMsg').textContent='Exported '+items.length+' Pikmin.';
  }catch(e){ $('ioMsg').textContent='Export not available here.'; }
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    const arr=Array.isArray(data)?data:data.items;
    if(!Array.isArray(arr)) throw new Error('bad');
    if(!Array.isArray(data) && Array.isArray(data.catalog)){
      const cl=data.catalog.filter(d=>d&&d.name&&d.category).map(d=>({category:String(d.category),name:String(d.name),rare:!!d.rare,place:!!d.place,letter:!!d.letter}));
      if(cl.length){ catalog=cl; saveCatalog(); }
    }
    let n=0;
    arr.forEach(p=>{
      if(!p||!p.id||!COLORS.some(c=>c.k===p.color)) return;
      upsert({id:String(p.id),name:p.name||p.color,color:p.color,decor:p.decor||'',pendCat:p.pendCat||'',status:statusOf(p),place:p.place||'',letter:p.letter||'',affinity:Math.min(8,Math.max(0,+p.affinity||0)),fruits:+p.fruits||0,released:!!p.released,releasedAt:p.releasedAt||null,createdAt:p.createdAt||Date.now()});
      n++;
    });
    $('ioMsg').textContent='Imported '+n+' Pikmin.';
  }catch(err){ $('ioMsg').textContent='That file could not be read.'; }
  e.target.value='';
};

/* ---------- init ---------- */
renderPickers();
refreshDecorUi();
render();

(async function(){
  let started=false;
  const start=s=>{
    if(started) return; started=true; store=s;
    $('storeNote').textContent = s.kind==='db' ? 'Saved to your private cloud storage.' : 'Saved in this browser only (cloud storage unavailable).';
    s.subscribe(arr=>{
      const cat=arr.find(x=>x&&x.id==='__catalog');
      const before=JSON.stringify(catalog);
      if(cat&&Array.isArray(cat.decors)&&cat.decors.length) catalog=cat.decors;
      items=arr.filter(x=>x&&x.id!=='__catalog');
      if(JSON.stringify(catalog)!==before) refreshDecorUi();
      render();
    });
  };
  // show the page immediately with local storage, upgrade to db if it answers
  const timer=setTimeout(()=>start(makeLocalStore()), 10000);
  const d=await makeDbStore();
  clearTimeout(timer);
  start(d||makeLocalStore());
})();
</script>
